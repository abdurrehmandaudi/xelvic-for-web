<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The API is the first request this page makes and the slowest one to
         start, because DNS and TLS to a new host happen before a byte of JSON
         moves. Opening those two ahead of the bundle means the first call is a
         request rather than a request plus a handshake. `crossorigin` matters:
         the API answers CORS, and a preconnect without it opens a connection
         the CORS request cannot reuse. In dev the calls go to localhost and
         these point at a host nothing uses — a dud socket, not a delay. -->
    <link rel="preconnect" href="https://api.xelvic.com" crossorigin />
    <link rel="dns-prefetch" href="https://api.xelvic.com" />
    <meta name="theme-color" content="#F7F7FB" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Xelvic is where drops, moments, conversations, audio and live rooms meet. Share a post, a clip or a thought, and keep the room you keep."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="application-name" content="Xelvic" />
    <meta property="og:site_name" content="Xelvic" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Xelvic — share what you are looking at" />
    <meta property="og:description" content="Drops, moments, conversations, audio and live rooms. Share a post, a clip or a thought." />
    <meta property="og:url" content="https://xelvic.com/" />
    <meta property="og:image" content="https://xelvic.com/xelvic.png" />
    <meta property="og:image:alt" content="The Xelvic mark" />
    <meta property="og:locale" content="en_GB" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Xelvic — share what you are looking at" />
    <meta name="twitter:description" content="Drops, moments, conversations, audio and live rooms." />
    <meta name="twitter:image" content="https://xelvic.com/xelvic.png" />
    <title>Xelvic — share what you are looking at</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://xelvic.com/#organization",
            "name": "Xelvic",
            "url": "https://xelvic.com/",
            "logo": "https://xelvic.com/xelvic.png"
          },
          {
            "@type": "WebSite",
            "@id": "https://xelvic.com/#website",
            "name": "Xelvic",
            "url": "https://xelvic.com/",
            "publisher": { "@id": "https://xelvic.com/#organization" },
            "inLanguage": "en"
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
